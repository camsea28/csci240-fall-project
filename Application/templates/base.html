<!doctype html>
<html>

<head>
   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
   <title>{% block title %}{% endblock %}</title>
</head>

<body>
   <h1>
      {% block header %}{% endblock %}
   </h1>
   {% if error %}
   <p style="color: red;"><strong>Error:</strong> {{ error }}</p>
   {% endif %}
   {% block content %}{% endblock %}
</body>

</html>
